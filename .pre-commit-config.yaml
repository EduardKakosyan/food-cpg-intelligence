repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.2
    hooks:
      - id: ruff        # linter
        args: [--fix]
      - id: ruff-format # formatter

  # ──── Data safety: block data/model files from being committed ────
  - repo: local
    hooks:
      - id: forbid-data-files
        name: Block data and model files from commit
        entry: "bash -c 'echo BLOCKED -- data/model files must not be committed && exit 1' --"
        language: system
        files: '(?x)^(data/raw/.*|data/processed/.*|data/training/.*|data/evaluation/.*|data/embeddings/.*|models/(?!\.gitkeep$).*|.*\.mp4$|.*\.wav$|.*\.mp3$|.*\.gguf$|.*\.safetensors$)$'
        exclude: '\.gitkeep$'

  # ──── Strip notebook outputs before commit ────
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
