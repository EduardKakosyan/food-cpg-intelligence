# MLX LoRA Fine-Tuning Configuration (Apple Silicon)
# Used by: fcpg train finetune --config configs/training.yaml

# Model — Qwen 3.5 9B on M4 Pro 48GB (close other apps, use batch 1 + grad checkpoint)
model: "Qwen/Qwen3.5-9B"

# LoRA hyperparameters
lora:
  rank: 16          # capacity vs parameter count tradeoff
  alpha: 32         # standard 2x rank scaling
  dropout: 0.05     # light regularization for small dataset
  layers: 8         # fewer layers = less memory (was 16)

# Training — memory-conservative for 48GB with 9B model
batch_size: 1       # reduced from 2 to fit in memory
grad_accumulation: 8  # effective batch still = 8
iters: 2000         # ~3.4 epochs over 4,642 examples at eff batch 8
learning_rate: 2.0e-5  # conservative; sweep 1e-5 to 5e-5
max_seq_length: 2048
warmup_steps: 50    # ~8% warmup
grad_checkpoint: true   # saves memory at cost of ~30% slower training
seed: 42

# Data paths
data_dir: "data/training/mlx"
adapter_dir: "models/adapters/skufood"

# Reporting and checkpoints
steps_per_report: 10
steps_per_eval: 50
save_every: 100
val_batches: 25
