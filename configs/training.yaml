# QLoRA Fine-Tuning Configuration
# Override individual values via FCPG_ environment variables.

# Primary: Qwen 3.5 9B (latest, Unsloth QLoRA 22GB VRAM, thinking mode)
# Alternatives: Qwen/Qwen3.5-4B (smaller, fits easily on M4 Pro),
#               google/gemma-3-4b-it (strong at 4B tier)
base_model: "Qwen/Qwen3.5-9B"

# LoRA hyperparameters
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# SFTTrainer settings
trainer:
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  max_seq_length: 2048
  warmup_ratio: 0.03
  weight_decay: 0.01
  fp16: false   # set true for A100
  bf16: true    # preferred on A100
  save_steps: 500
  logging_steps: 10

# Data
dataset:
  train_split: 0.9
  val_split: 0.1
  seed: 42

# Output
output_dir: "models/checkpoints"
final_model_dir: "models/merged"
