[project]
name = "food-cpg-intelligence"
version = "0.1.0"
description = "Food & CPG Product Intelligence Platform — Domain-specific Q&A with fine-tuned AI and RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eduard Kakosyan" }]

dependencies = [
    # --- Data Pipeline ---
    "pandas>=2.2",
    "polars>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-docx>=1.1",
    # --- Embeddings & Vector Store ---
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "qdrant-client>=1.9",
    # --- RAG & LLM ---
    "transformers>=4.44",
    "torch>=2.4",
    "accelerate>=0.33",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "datasets>=2.20",
    # --- Evaluation ---
    "ragas>=0.1",
    "anthropic>=0.34",
    # --- API / Serving ---
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # --- Utilities ---
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "typer>=0.12",
    "tqdm>=4.66",
    "tenacity>=8.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.8",
    "ipykernel>=6.29",
    "nbstripout>=0.7",
]
training = [
    "unsloth>=2024.8",
    "trl>=0.9",
]
local = [
    "mlx-lm>=0.20",
]

[project.scripts]
fcpg = "food_cpg_intelligence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/food_cpg_intelligence"]

# ---------- Ruff ----------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "TCH001", # first-party imports used at runtime with __future__ annotations
    "TCH003", # stdlib imports used at runtime (Path, date) with __future__ annotations
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.isort]
known-first-party = ["food_cpg_intelligence"]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

# ---------- Coverage ----------
[tool.coverage.run]
source = ["src/food_cpg_intelligence"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50
